<!DOCTYPE html>
<html lang="pl" data-design="modern">
<!-- DESIGN SWITCH: data-design="modern" (new look) or "classic" (original look). Everything else stays the same. -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cookiery 🎄</title>
<meta name="description" content="zakręć kołem i wygraj nagrodę · nocny market, warszawa">
<meta property="og:title" content="cookiery 🎄">
<meta property="og:description" content="zakręć kołem i wygraj nagrodę · nocny market, warszawa">
<meta property="og:type" content="website">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Nunito:wght@400;600;700;800;900&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #FFC0CB;
    --pink-light: #FFE4EA;
    --pink-deep: #D4637A;
    --brown: #513724;
    --brown-mid: #7A5640;
    --cream: #F9E2C7;
    --warm-white: #FFF8F5;
    --xmas-red: #C1272D;
    --xmas-green: #2F6B4D;
    --insta: #E1306C;
    --google: #4285F4;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--pink-light);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    overflow-x: hidden;
  }

  .app {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    position: relative;
    overflow: hidden;
  }

  /* ── SCREENS ── */
  .screen {
    display: none;
    width: 100%;
    min-height: 100vh;
    flex-direction: column;
    align-items: center;
    padding-bottom: 48px;
    animation: fadeUp 0.35s ease both;
  }
  .screen.active { display: flex; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── HEADER ── */
  .header {
    width: 100%;
    background: var(--brown);
    padding: 32px 24px 56px;
    text-align: center;
    position: relative;
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: -30px; left: 0; right: 0;
    height: 60px;
    background: var(--brown);
    clip-path: ellipse(52% 100% at 50% 0%);
  }

  .logo {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 46px;
    color: var(--pink-light);
    line-height: 1;
    letter-spacing: -1px;
  }
  .logo-tag {
    font-size: 11px;
    color: var(--pink);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-top: 5px;
  }

  /* ── WELCOME ── */
  .welcome-body {
    margin-top: 58px;
    padding: 0 28px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .big-cookie {
    font-size: 72px;
    display: block;
    animation: rock 2.8s ease-in-out infinite;
    filter: drop-shadow(0 8px 16px rgba(60,20,10,0.18));
  }
  @keyframes rock {
    0%,100% { transform: rotate(-8deg) scale(1); }
    50%      { transform: rotate(8deg) scale(1.06); }
  }

  .welcome-title {
    font-family: 'Playfair Display', serif;
    font-size: 30px;
    color: var(--brown);
    line-height: 1.25;
    margin-top: 16px;
  }
  .welcome-sub {
    font-size: 15px;
    color: var(--brown-mid);
    margin-top: 10px;
    line-height: 1.65;
  }

  .prizes-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 24px;
    width: 100%;
  }
  .prize-chip {
    background: var(--warm-white);
    border: 1.5px solid var(--pink);
    border-radius: 14px;
    padding: 10px 12px;
    font-size: 13px;
    font-weight: 700;
    color: var(--brown);
    text-align: center;
    line-height: 1.4;
  }
  .prize-chip span { display: block; font-size: 20px; margin-bottom: 4px; }

  /* ── BUTTONS ── */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 18px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: transform 0.12s, box-shadow 0.12s;
    letter-spacing: 0.01em;
  }
  .btn:active { transform: translateY(3px); }

  .btn-primary {
    background: var(--brown);
    color: var(--pink-light);
    padding: 18px 52px;
    box-shadow: 0 6px 0 #2e1d10;
    margin-top: 28px;
    width: 100%;
  }
  .btn-primary:active { box-shadow: 0 3px 0 #2e1d10; }

  .btn-ghost {
    background: transparent;
    color: var(--brown-mid);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 16px;
    margin-top: 10px;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .btn-insta {
    background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
    color: white;
    padding: 16px 24px;
    width: 100%;
    font-size: 16px;
    border-radius: 16px;
    box-shadow: 0 5px 0 rgba(0,0,0,0.2);
  }
  .btn-insta:active { box-shadow: 0 2px 0 rgba(0,0,0,0.2); }

  .btn-google {
    background: white;
    color: #333;
    padding: 16px 24px;
    width: 100%;
    font-size: 16px;
    border-radius: 16px;
    border: 2px solid #e0e0e0;
    box-shadow: 0 5px 0 rgba(0,0,0,0.1);
  }
  .btn-google:active { box-shadow: 0 2px 0 rgba(0,0,0,0.1); }

  /* ── SPIN SCREEN ── */
  .spin-body {
    margin-top: 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 20px;
    width: 100%;
  }

  .spin-title {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    color: var(--brown);
    text-align: center;
    margin-bottom: 4px;
  }
  .spin-sub {
    font-size: 13px;
    color: var(--brown-mid);
    text-align: center;
    margin-bottom: 32px;
  }

  .wheel-wrap {
    position: relative;
    width: 300px;
    height: 300px;
  }
  #wheel {
    width: 300px;
    height: 300px;
    display: block;
  }
  .wheel-pin {
    position: absolute;
    top: -16px;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 13px solid transparent;
    border-right: 13px solid transparent;
    border-top: 26px solid var(--brown);
    filter: drop-shadow(0 3px 4px rgba(0,0,0,0.3));
    z-index: 10;
  }
  .wheel-hub {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 52px; height: 52px;
    background: var(--warm-white);
    border: 4px solid var(--brown);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.25);
    z-index: 10;
  }

  .spin-launch {
    background: var(--pink-deep);
    color: white;
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 22px;
    border: none;
    border-radius: 50px;
    padding: 18px 64px;
    cursor: pointer;
    margin-top: 32px;
    box-shadow: 0 6px 0 #a8324a;
    transition: transform 0.12s, box-shadow 0.12s;
    letter-spacing: 0.02em;
  }
  .spin-launch:active { transform: translateY(3px); box-shadow: 0 3px 0 #a8324a; }
  .spin-launch:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

  /* ── RESULT SCREEN ── */
  .result-body {
    margin-top: 48px;
    width: 100%;
    padding: 0 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .won-badge {
    background: var(--pink-deep);
    color: white;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 6px 22px;
    border-radius: 50px;
    margin-bottom: 14px;
  }

  .prize-emoji { font-size: 80px; margin-bottom: 10px; animation: pop 0.4s cubic-bezier(0.34,1.56,0.64,1) both; }
  @keyframes pop { from { transform: scale(0.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .prize-title {
    font-family: 'Playfair Display', serif;
    font-size: 32px;
    color: var(--brown);
    line-height: 1.2;
    margin-bottom: 8px;
  }
  .prize-desc {
    font-size: 15px;
    color: var(--brown-mid);
    line-height: 1.65;
    margin-bottom: 20px;
  }

  /* countdown */
  .timer-box {
    background: var(--brown);
    color: var(--pink-light);
    border-radius: 18px;
    padding: 14px 28px;
    width: 100%;
    text-align: center;
    margin-bottom: 22px;
  }
  .timer-label { font-size: 11px; opacity: 0.65; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 4px; }
  .timer-digits { font-size: 38px; font-weight: 900; letter-spacing: 0.08em; font-variant-numeric: tabular-nums; }

  /* action section */
  .action-heading {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    color: var(--brown);
    margin-bottom: 6px;
  }
  .action-sub {
    font-size: 13px;
    color: var(--brown-mid);
    margin-bottom: 16px;
    line-height: 1.5;
  }

  /* tabs */
  .tabs {
    display: flex;
    width: 100%;
    background: var(--warm-white);
    border-radius: 16px 16px 0 0;
    overflow: hidden;
    border: 1.5px solid var(--pink);
    border-bottom: none;
  }
  .tab {
    flex: 1;
    padding: 12px 8px;
    text-align: center;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
    color: var(--brown-mid);
    border: none;
    background: transparent;
    transition: background 0.2s, color 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .tab.active {
    background: var(--brown);
    color: var(--pink-light);
  }

  .tab-panel {
    display: none;
    width: 100%;
    background: var(--warm-white);
    border: 1.5px solid var(--pink);
    border-top: none;
    border-radius: 0 0 16px 16px;
    padding: 20px 18px;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    text-align: center;
  }
  .tab-panel.active { display: flex; }

  .tab-instruction {
    font-size: 14px;
    color: var(--brown-mid);
    line-height: 1.6;
  }
  .tab-instruction strong { color: var(--brown); }

  .step-pills {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
  }
  .step-pill {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--pink-light);
    border-radius: 12px;
    padding: 10px 14px;
    text-align: left;
  }
  .step-pill-num {
    width: 26px; height: 26px;
    background: var(--brown);
    color: var(--pink-light);
    border-radius: 50%;
    font-size: 12px;
    font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .step-pill-text { font-size: 13px; color: var(--brown); font-weight: 600; line-height: 1.4; }

  .counter-note {
    background: var(--pink-light);
    border: 1.5px dashed var(--pink-deep);
    border-radius: 14px;
    padding: 12px 16px;
    font-size: 13px;
    color: var(--brown);
    font-weight: 700;
    width: 100%;
    margin-top: 6px;
    line-height: 1.5;
  }

  /* ── HOW-TO ── */
  .howto-body {
    margin-top: 48px;
    width: 100%;
    padding: 0 24px;
  }
  .howto-title {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    color: var(--brown);
    text-align: center;
    margin-bottom: 24px;
  }
  .how-step {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    margin-bottom: 22px;
  }
  .how-num {
    width: 38px; height: 38px;
    background: var(--brown);
    color: var(--pink-light);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900;
    font-size: 17px;
    flex-shrink: 0;
  }
  .how-content { flex: 1; padding-top: 2px; }
  .how-head { font-weight: 800; color: var(--brown); font-size: 15px; }
  .how-text { font-size: 13px; color: var(--brown-mid); margin-top: 3px; line-height: 1.55; }
  .hr { width: 100%; height: 1px; background: var(--pink); margin: 4px 0 22px; }
  .fine-print {
    font-size: 12px;
    color: var(--brown-mid);
    text-align: center;
    line-height: 1.8;
    margin-bottom: 28px;
  }

  /* confetti */
  #confetti { pointer-events: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 999; display: none; }


  /* ══════════════════════════════════════
     ADDED (works in both designs)
  ══════════════════════════════════════ */
  .lang {
    position: absolute; top: 14px; right: 14px; z-index: 30;
    display: flex; gap: 2px; padding: 3px;
    background: rgba(255,243,236,0.14);
    border: 1px solid rgba(255,243,236,0.4);
    border-radius: 999px;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .lang button {
    border: none; background: transparent; color: var(--pink-light);
    font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 12px;
    letter-spacing: 0.08em; padding: 7px 13px; border-radius: 999px; cursor: pointer;
  }
  .lang button.on { background: var(--pink-light); color: var(--brown); }

  .show-banner {
    border: 1.5px dashed var(--pink-deep);
    background: var(--pink-light);
    color: var(--brown);
    font-weight: 800; font-size: 13px;
    padding: 9px 18px; border-radius: 50px;
    margin-bottom: 16px;
  }

  /* ══════════════════════════════════════
     MODERN DESIGN  (same colors, fonts, layout — refreshed)
  ══════════════════════════════════════ */
  html[data-design="modern"] body {
    background: linear-gradient(180deg, #FFF1F4 0%, #FFE3EA 55%, #FFD3DD 100%);
  }
  html[data-design="modern"] .header {
    background: radial-gradient(130% 150% at 50% 0%, #6a4630 0%, var(--brown) 65%);
    border-radius: 0 0 36px 36px;
    padding: 36px 24px 38px;
    box-shadow: 0 14px 32px rgba(81,55,36,0.2);
  }
  html[data-design="modern"] .header::after { display: none; }
  html[data-design="modern"] .logo { letter-spacing: -0.5px; text-shadow: 0 2px 14px rgba(242,167,176,0.25); }
  html[data-design="modern"] .logo-tag { letter-spacing: 0.16em; opacity: 0.95; }

  html[data-design="modern"] .welcome-body { margin-top: 30px; }
  html[data-design="modern"] .spin-body    { margin-top: 30px; }
  html[data-design="modern"] .result-body  { margin-top: 30px; }
  html[data-design="modern"] .howto-body   { margin-top: 30px; }

  html[data-design="modern"] .prize-chip {
    background: #fff; border: none; border-radius: 20px;
    padding: 16px 12px;
    box-shadow: 0 8px 22px rgba(193,39,45,0.16);
  }
  html[data-design="modern"] .prize-chip span { font-size: 24px; }

  html[data-design="modern"] .btn-primary {
    background: linear-gradient(135deg, #5e3f2a, var(--brown));
    box-shadow: 0 14px 28px rgba(81,55,36,0.3);
  }
  html[data-design="modern"] .btn-primary:active { transform: scale(0.97); box-shadow: 0 6px 14px rgba(81,55,36,0.3); }
  html[data-design="modern"] .btn-ghost { color: var(--brown-mid); }

  html[data-design="modern"] .spin-launch {
    background: linear-gradient(135deg, #e0708a, var(--pink-deep));
    box-shadow: 0 14px 28px rgba(193,39,45,0.42);
  }
  html[data-design="modern"] .spin-launch:active { transform: scale(0.97); box-shadow: 0 6px 14px rgba(193,39,45,0.42); }
  html[data-design="modern"] #wheel { filter: drop-shadow(0 16px 24px rgba(81,55,36,0.22)); }
  html[data-design="modern"] .wheel-hub { box-shadow: 0 6px 16px rgba(0,0,0,0.28); }

  html[data-design="modern"] .won-badge { background: linear-gradient(135deg, #e0708a, var(--pink-deep)); box-shadow: 0 8px 18px rgba(193,39,45,0.35); }
  html[data-design="modern"] .timer-box {
    background: radial-gradient(120% 160% at 50% 0%, #6a4630 0%, var(--brown) 70%);
    border-radius: 24px; box-shadow: 0 14px 28px rgba(81,55,36,0.25);
  }

  html[data-design="modern"] .tabs {
    background: rgba(81,55,36,0.07); border: none; border-radius: 18px;
    padding: 5px; gap: 4px; margin-bottom: 12px; overflow: visible;
  }
  html[data-design="modern"] .tab { border-radius: 14px; }
  html[data-design="modern"] .tab.active { box-shadow: 0 6px 14px rgba(81,55,36,0.25); }
  html[data-design="modern"] .tab-panel {
    background: #fff; border: none; border-radius: 24px;
    box-shadow: 0 12px 32px rgba(81,55,36,0.1);
  }
  html[data-design="modern"] .step-pill { background: #FFF0EA; border-radius: 16px; }
  html[data-design="modern"] .counter-note { border-radius: 16px; background: #FFF0EA; }
  html[data-design="modern"] .btn-insta { border-radius: 18px; box-shadow: 0 10px 22px rgba(220,39,67,0.28); }
  html[data-design="modern"] .btn-google { border-radius: 18px; border: 1.5px solid #e8e8e8; box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
  html[data-design="modern"] .btn-insta:active,
  html[data-design="modern"] .btn-google:active { transform: scale(0.98); }

  html[data-design="modern"] .how-num { box-shadow: 0 6px 14px rgba(81,55,36,0.25); }
  html[data-design="modern"] .hr { background: rgba(193,39,45,0.3); }
  html[data-design="modern"] .show-banner { background: #fff; box-shadow: 0 6px 16px rgba(193,39,45,0.16); }

  /* ══════════════════════════════════════
     CHRISTMAS EDITION
  ══════════════════════════════════════ */
  /* string lights along the top of every header */
  .header::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 18px;
    pointer-events: none; z-index: 2;
    background:
      radial-gradient(circle at 12px 10px, #ff4b55 0 4px, transparent 5px),
      radial-gradient(circle at 36px 10px, #ffd75e 0 4px, transparent 5px),
      radial-gradient(circle at 60px 10px, #4fd18b 0 4px, transparent 5px),
      radial-gradient(circle at 84px 10px, #7cc4ff 0 4px, transparent 5px),
      linear-gradient(rgba(255,243,236,0.35), rgba(255,243,236,0.35)) 0 4px / 100% 1px no-repeat;
    background-size: 96px 18px, 96px 18px, 96px 18px, 96px 18px, 100% 1px;
    background-repeat: repeat-x, repeat-x, repeat-x, repeat-x, no-repeat;
    filter: drop-shadow(0 0 4px rgba(255,215,94,0.7));
    animation: twinkle 1.8s ease-in-out infinite alternate;
  }
  @keyframes twinkle { from { opacity: 0.55; } to { opacity: 1; } }
  .lang { top: 26px; }
  .music-btn {
    position: absolute; top: 26px; left: 14px; z-index: 30;
    width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid rgba(255,243,236,0.4);
    background: rgba(255,243,236,0.14);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    font-size: 17px; line-height: 1; cursor: pointer; color: var(--pink-light);
    display: flex; align-items: center; justify-content: center;
  }
  .music-btn.off { opacity: 0.7; }

  .logo::after { content: ' 🎄'; font-style: normal; font-size: 0.55em; vertical-align: 0.35em; }

  /* santa hat on the big cookie */
  .big-cookie { position: relative; display: inline-block; }
  .big-cookie::before {
    content: ''; position: absolute; top: -14px; left: 50%; margin-left: -34px;
    width: 0; height: 0;
    border-left: 30px solid transparent; border-right: 30px solid transparent;
    border-bottom: 42px solid var(--pink-deep);
    transform: rotate(-14deg); transform-origin: 50% 100%; z-index: 2;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2));
  }
  .big-cookie::after {
    content: ''; position: absolute; top: -26px; left: 50%; margin-left: -14px;
    width: 14px; height: 14px; border-radius: 50%; background: #fff; z-index: 3;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.06);
  }

  .prize-chip { border-color: var(--pink-deep); }
  html[data-design="modern"] .prize-chip { border: none; box-shadow: 0 8px 22px rgba(193,39,45,0.16); }
  html[data-design="modern"] .prize-chip:nth-child(odd)  { border-top: 4px solid var(--pink-deep); }
  html[data-design="modern"] .prize-chip:nth-child(even) { border-top: 4px solid #2F6B4D; }

  /* ── COOKIERY BRAND LAYER: milky pink, brown script sign, cream accents ── */
  html[data-design="modern"] .header {
    background: linear-gradient(180deg, #FFB6C4 0%, #FFC0CB 50%, #FFD2DB 100%);
    box-shadow: 0 14px 32px rgba(212,99,122,0.28);
  }
  .header::before { background-image:
      radial-gradient(circle at 12px 10px, #ff4b55 0 4px, transparent 5px),
      radial-gradient(circle at 36px 10px, #fff3b0 0 4px, transparent 5px),
      radial-gradient(circle at 60px 10px, #3fae76 0 4px, transparent 5px),

  html[data-design="modern"] .step-pill, html[data-design="modern"] .counter-note { background: #FFE4EA; }

  /* snow sits BEHIND the game (cards, text, wheel) so it never covers anything */
  #snow { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 0; }
  .app { z-index: 1; }
  .wheel-pin { border-top-color: var(--xmas-red); }

  /* ── MOTION: Santa flies across, lights pop on behind him, then chase-twinkle ── */
  .header::before { display: none !important; }
  .lights { position: absolute; top: 0; left: 0; right: 0; height: 30px; display: flex; justify-content: space-between; align-items: flex-start; padding: 0 10px; pointer-events: none; z-index: 3; }
  .lights::before { content: ''; position: absolute; left: 0; right: 0; top: 3px; height: 1.5px; background: rgba(81,55,36,0.45); }
  .bulb { position: relative; width: 9px; height: 13px; margin-top: 5px; background: var(--c); border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%; opacity: 0.3; animation: ignite 14s linear infinite both; animation-delay: var(--d); }
  .bulb:nth-child(even) { margin-top: 11px; }
  .bulb::before { content: ''; position: absolute; top: -4px; left: 2px; width: 5px; height: 5px; background: #7A5640; border-radius: 1px; }
  .bulb::after { content: ''; position: absolute; inset: -6px; border-radius: 50%; background: radial-gradient(circle, var(--c) 0%, transparent 70%); opacity: 0.2; animation: glow 1.4s ease-in-out infinite alternate; animation-delay: var(--g); }
  @keyframes ignite { 0% { opacity: 0.3; transform: scale(1); } 1% { opacity: 1; transform: scale(1.6); } 2.5% { opacity: 1; transform: scale(1); } 92% { opacity: 1; } 97%, 100% { opacity: 0.3; } }
  @keyframes glow { from { opacity: 0.25; } to { opacity: 0.9; } }
  .santa { position: absolute; top: -8px; left: -16%; font-size: 24px; line-height: 1; white-space: nowrap; pointer-events: none; z-index: 4; animation: fly 14s linear infinite; filter: drop-shadow(0 0 6px rgba(255,230,150,0.9)); }
  .santa i { display: inline-block; font-style: normal; animation: bob 0.5s ease-in-out infinite alternate; }
  @keyframes fly { 0% { left: -16%; } 25% { left: 104%; } 100% { left: 104%; } }
  @keyframes bob { from { transform: translateY(0) rotate(-3deg); } to { transform: translateY(5px) rotate(3deg); } }

  /* ── MOTION: floating, breathing, entrances ── */
  @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes sway { 0%, 100% { transform: rotate(-1.4deg); } 50% { transform: rotate(1.4deg); } }
  @keyframes breatheBrown { 0%, 100% { box-shadow: 0 14px 28px rgba(81,55,36,0.3), 0 0 0 0 rgba(193,39,45,0.0); } 50% { box-shadow: 0 14px 28px rgba(81,55,36,0.3), 0 0 0 9px rgba(193,39,45,0.14); } }
  @keyframes breathePink { 0%, 100% { box-shadow: 0 14px 28px rgba(212,99,122,0.45), 0 0 24px rgba(255,120,160,0.35); } 50% { box-shadow: 0 14px 28px rgba(212,99,122,0.45), 0 0 38px 6px rgba(255,120,160,0.6); } }
  html[data-design="modern"] .logo { animation: sway 5s ease-in-out infinite; }
  .prize-chip { animation: floaty 3.6s ease-in-out infinite; }
  .prize-chip:nth-child(2) { animation-delay: 0.5s; }
  .prize-chip:nth-child(3) { animation-delay: 1s; }
  .prize-chip:nth-child(4) { animation-delay: 1.5s; }
  .welcome-title, .welcome-sub { animation: rise 0.6s ease both; }
  .welcome-sub { animation-delay: 0.12s; }
  .welcome-body .btn-primary { animation: rise 0.6s 0.35s ease both, breatheBrown 2.4s 1s ease-in-out infinite; }
  html[data-design="modern"] .spin-launch { animation: breathePink 2s ease-in-out infinite; }
  .prize-emoji { animation: pop 0.4s cubic-bezier(0.34,1.56,0.64,1) both, floaty 3s 0.6s ease-in-out infinite; }
  .won-badge { animation: rise 0.5s ease both; }
  .wheel-pin.tick { animation: tick 0.16s linear infinite; transform-origin: 50% 0; }
  @keyframes tick { 0%, 100% { transform: translateX(-50%) rotate(0); } 50% { transform: translateX(-50%) rotate(-14deg); } }
  @media (prefers-reduced-motion: reduce) {
    .santa, .bulb::after, .prize-chip, .logo, .btn-primary, .spin-launch, .prize-emoji { animation: none !important; }
    .santa { display: none; } .bulb { animation: none; opacity: 1; }  }

/* ── WHEEL (drawn sharp on high-density screens) ── */
const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const DPR = Math.min(window.devicePixelRatio || 1, 3);
canvas.width = 300 * DPR;
canvas.height = 300 * DPR;
canvas.style.width = '300px';
canvas.style.height = '300px';
ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
const CX = 150, CY = 150, R = 140;
let spinning = false;
let currentAngle = 0;

function drawWheel(angle) {
  ctx.clearRect(0, 0, 300, 300);
  const arc = (2 * Math.PI) / NUM;

  for (let i = 0; i < NUM; i++) {
    const seg = segData(i);
    const start = angle + i * arc;
    const end = start + arc;

    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.arc(CX, CY, R, start, end);
    ctx.closePath();
    ctx.fillStyle = seg.color;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.save();
    ctx.translate(CX, CY);
    ctx.rotate(start + arc / 2);
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = seg.textColor;
    ctx.font = '800 14px Nunito, sans-serif';
    const lines = seg.label.split('\n');
    lines.forEach((line, li) => {
      ctx.fillText(line, R - 12, (li - (lines.length - 1) / 2) * 16);
    });
    ctx.restore();
  }

  ctx.beginPath();
  ctx.arc(CX, CY, R, 0, 2 * Math.PI);
  ctx.strokeStyle = '#513724';
  ctx.lineWidth = 5;
  ctx.stroke();

  // christmas bulbs around the rim
  const bulbs = ['#ff4b55', '#ffd75e', '#4fd18b', '#ffffff'];
  for (let b = 0; b < 24; b++) {
    const a = angle * 0.15 + b * (2 * Math.PI / 24);
    const lit = (Math.floor(performance.now() / 450) + b) % 2 === 0;
    ctx.beginPath();
    ctx.arc(CX + Math.cos(a) * R, CY + Math.sin(a) * R, lit ? 4.2 : 3.2, 0, 2 * Math.PI);
    ctx.globalAlpha = lit ? 1 : 0.45;
    ctx.fillStyle = bulbs[b % 4];
    ctx.fill();
    ctx.strokeStyle = 'rgba(81,55,36,0.55)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  ctx.beginPath();
  ctx.arc(CX, CY, R - 2, 0, 2 * Math.PI);
  ctx.strokeStyle = 'rgba(0,0,0,0.12)';
  ctx.lineWidth = 3;
  ctx.stroke();
}

/* ── FAIR DRAW (unchanged) ──
   Every prize has exactly the same chance, and no prize repeats until
   all the others have come up. */
let prizeBag = [];
let lastPrizeIndex = -1;

function refillBag() {
  prizeBag = PRIZES.map((_, i) => i);
  for (let i = prizeBag.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [prizeBag[i], prizeBag[j]] = [prizeBag[j], prizeBag[i]];
  }
  if (prizeBag.length > 1 && prizeBag[0] === lastPrizeIndex) {
    [prizeBag[0], prizeBag[1]] = [prizeBag[1], prizeBag[0]];
  }
}
function drawPrizeIndex() {
  if (prizeBag.length === 0) refillBag();
  const idx = prizeBag.shift();
  lastPrizeIndex = idx;
  return idx;
}

/* ── SOUND + VIBRATION ── */
let audioCtx = null;
function unlockAudio() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {}
}
function celebrate() {
  try { if (navigator.vibrate) navigator.vibrate([90, 50, 140]); } catch (e) {}
  try {
    if (!audioCtx) return;
    [[660, 0], [880, 0.12], [1175, 0.24]].forEach(([f, d]) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t0 = audioCtx.currentTime + d;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.1, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.3);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0); o.stop(t0 + 0.32);
    });
  } catch (e) {}
}

/* ── SPIN ── */
function spinWheel() {
  if (spinning) return;

  spinning = true;
  unlockAudio();
  track('spin_started');
  document.getElementById('spinBtn').disabled = true;
  document.querySelector('.wheel-pin').classList.add('tick');

  const prizeIndex = drawPrizeIndex();
  const winIndex = prizeIndex * 2 + Math.floor(Math.random() * 2);

  const arc = (2 * Math.PI) / NUM;
  const normalizedCurrent = ((currentAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
  const segmentCenter = (winIndex + 0.5) * arc;
  const pointerPos = 3 * Math.PI / 2;
  let offset = (pointerPos - segmentCenter + 2 * Math.PI) % (2 * Math.PI);

  const totalSpins = 8 + Math.floor(Math.random() * 4);
  const totalRotation = totalSpins * 2 * Math.PI + offset - normalizedCurrent;

  const finalAngle = normalizedCurrent + totalRotation;
  const startAngle = normalizedCurrent;
  const duration = 4500;
  const startTime = performance.now();

  function animate(now) {
    const elapsed = now - startTime;
    const p = Math.min(elapsed / duration, 1);
    const ease = 1 - Math.pow(1 - p, 4);
    drawWheel(startAngle + totalRotation * ease);

    if (p < 1) {
      requestAnimationFrame(animate);
    } else {
      currentAngle = finalAngle;
      spinning = false;
      document.querySelector('.wheel-pin').classList.remove('tick');
      setTimeout(() => showResult(winIndex), 500);
    }
  }
  requestAnimationFrame(animate);
}

  c.height = window.innerHeight;
  const colors = ['#FFC0CB','#513724','#C1272D','#FFF3EC','#2F6B4D','#FFF8F2'];
  const pieces = Array.from({length: 90}, () => ({
    x: Math.random() * c.width,
    y: -20,
    w: 6 + Math.random() * 8,
    h: 4 + Math.random() * 5,
    color: colors[Math.floor(Math.random() * colors.length)],

  }));

/* ── CHRISTMAS: SNOW ── */
(function () {
  const c = document.createElement('canvas');
  c.id = 'snow';
  document.body.appendChild(c);
  const x = c.getContext('2d');
  let W, H;
  function size() { W = c.width = window.innerWidth; H = c.height = window.innerHeight; }
  size();
  window.addEventListener('resize', size);
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const n = reduce ? 0 : (window.innerWidth < 500 ? 22 : 38);
  const flakes = Array.from({ length: n }, () => ({
    x: Math.random() * W, y: Math.random() * H,
    r: 2.6 + Math.random() * 3.6, v: 0.3 + Math.random() * 0.7,
    s: Math.random() * Math.PI * 2, d: 0.4 + Math.random() * 0.6,
    rot: Math.random() * Math.PI, rs: (Math.random() - 0.5) * 0.02
  }));
  // six-armed crystal: pointed arms with little V branches
  function crystal(cx, cy, L, rot) {
    x.save(); x.translate(cx, cy); x.rotate(rot);
    x.beginPath();
    for (let k = 0; k < 6; k++) {
      x.rotate(Math.PI / 3);
      x.moveTo(0, 0); x.lineTo(0, -L);
      x.moveTo(-L * 0.32, -L * 0.82); x.lineTo(0, -L * 0.52); x.lineTo(L * 0.32, -L * 0.82);
    }
    x.restore();
    x.lineCap = 'round'; x.lineJoin = 'round';
    x.strokeStyle = 'rgba(150,175,205,0.35)'; x.lineWidth = 2.4; x.stroke();
    x.strokeStyle = 'rgba(255,255,255,0.9)'; x.lineWidth = 1.2; x.stroke();
  }
  function tick() {
    x.clearRect(0, 0, W, H);
    flakes.forEach(f => {
      f.y += f.v; f.s += 0.012;
      f.x += Math.sin(f.s) * f.d;
      if (f.y > H + 6) { f.y = -6; f.x = Math.random() * W; }
      if (f.x > W + 6) f.x = -6;
      if (f.x < -6) f.x = W + 6;
      f.rot += f.rs;
      crystal(f.x, f.y, f.r, f.rot);
    });
    requestAnimationFrame(tick);
  }
  if (n) requestAnimationFrame(tick);
})();

/* ── CHRISTMAS: MUSIC (synthesized, no audio files) ──
   Jingle Bells + We Wish You a Merry Christmas — both public domain. */
const SEMI = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function noteFreq(n) {
  const m = n.match(/^([A-G])(#?)(\d)$/);
  const midi = 12 * (+m[3] + 1) + SEMI[m[1]] + (m[2] ? 1 : 0);
  return 440 * Math.pow(2, (midi - 69) / 12) * 2; // one octave up = music-box register
}
function parseTune(s) { return s.trim().split(/\s+/).map(p => { const [n, d] = p.split(':'); return [n, +d]; }); }
const JB_A = 'E4:1 E4:1 E4:2 E4:1 E4:1 E4:2 E4:1 G4:1 C4:1.5 D4:.5 E4:4';
const JB_B = 'F4:1 F4:1 F4:1.5 F4:.5 F4:1 E4:1 E4:1 E4:.5 E4:.5 E4:1 D4:1 D4:1 E4:1 D4:2 G4:2';
const JB_END = 'F4:1 F4:1 F4:1 F4:1 F4:1 E4:1 E4:1 E4:.5 E4:.5 G4:1 G4:1 F4:1 D4:1 C4:4';
const TUNES = [
  { bpm: 150, notes: parseTune([JB_A, JB_B, JB_A, JB_END].join(' ')) },
  { bpm: 128, notes: parseTune('D4:1 G4:1 G4:.5 A4:.5 G4:.5 F#4:.5 E4:1 E4:1 E4:1 A4:1 A4:.5 B4:.5 A4:.5 G4:.5 F#4:1 D4:1 D4:1 B4:1 B4:.5 C5:.5 B4:.5 A4:.5 G4:1 E4:1 D4:.5 D4:.5 E4:1 A4:1 F#4:1 G4:3') }
];

let musicOn = false, master = null, pumpTimer = null, nextT = 0, tuneIdx = 0, noiseBuf = null;

function musicNote(f, t, d) {
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.17, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + Math.min(d + 0.5, 1.5));
  g.connect(master);
  [[1, 1], [3, 0.25], [5.4, 0.08]].forEach(([mul, amp]) => {
    const o = audioCtx.createOscillator(), og = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = f * mul; og.gain.value = amp;
    o.connect(og); og.connect(g);
    o.start(t); o.stop(t + Math.min(d + 0.55, 1.6));
  });
}
function sleighBell(t) {
  if (!noiseBuf) {
    noiseBuf = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * 0.09), audioCtx.sampleRate);
    const ch = noiseBuf.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
  }
  const s = audioCtx.createBufferSource(); s.buffer = noiseBuf;
  const bp = audioCtx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 7200; bp.Q.value = 1.4;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.05, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
  s.connect(bp); bp.connect(g); g.connect(master);
  s.start(t);
}
function scheduleTune(tune, t0) {
  const beat = 60 / tune.bpm;
  let t = t0;
  tune.notes.forEach(([n, d]) => { musicNote(noteFreq(n), t, d * beat); t += d * beat; });
  const total = t - t0;
  for (let b = 0; b < total / beat; b++) sleighBell(t0 + b * beat);
  return total;
}
function pump() {
  if (!musicOn || !audioCtx) return;
  if (audioCtx.currentTime > nextT - 0.8) {
    nextT += scheduleTune(TUNES[tuneIdx], nextT) + 0.8;
    tuneIdx = (tuneIdx + 1) % TUNES.length;
  }
}
function setMusicBtn() {
  const b = document.getElementById('musicBtn');
  b.textContent = musicOn ? '🔔' : '🔕';
  b.classList.toggle('off', !musicOn);
}
function startMusic() {
  unlockAudio();
  if (!audioCtx) return;
  master = audioCtx.createGain();
  master.gain.setValueAtTime(0.0001, audioCtx.currentTime);
  master.gain.linearRampToValueAtTime(0.7, audioCtx.currentTime + 0.4);
  master.connect(audioCtx.destination);
  musicOn = true;
  nextT = audioCtx.currentTime + 0.15;
  pump();
  clearInterval(pumpTimer);
  pumpTimer = setInterval(pump, 400);
  setMusicBtn();
}
function stopMusic() {
  musicOn = false;
  clearInterval(pumpTimer);
  if (master) {
    const m = master; master = null;
    m.gain.setTargetAtTime(0, audioCtx.currentTime, 0.05);
    setTimeout(() => { try { m.disconnect(); } catch (e) {} }, 500);
  }
  setMusicBtn();
}
function toggleMusic() {
  if (musicOn) { stopMusic(); try { localStorage.setItem('cookiery_music', 'off'); } catch (e) {} track('music_off'); }
  else { startMusic(); try { localStorage.setItem('cookiery_music', 'on'); } catch (e) {} track('music_on'); }
}
// browsers only allow sound after a tap: start on the first interaction unless the guest muted it before
let musicMuted = false;
try { musicMuted = localStorage.getItem('cookiery_music') === 'off'; } catch (e) {}
function firstTap(e) {
  document.removeEventListener('pointerdown', firstTap, true);
  if (e.target.closest && e.target.closest('#musicBtn')) return;
  if (!musicMuted && !musicOn) startMusic();
}
document.addEventListener('pointerdown', firstTap, true);
document.addEventListener('visibilitychange', () => {
  if (!audioCtx || !musicOn) return;
  if (document.hidden) audioCtx.suspend(); else audioCtx.resume();
});
setMusicBtn();
musicOn = false; setMusicBtn();
document.getElementById('musicBtn').textContent = '🔕';

/* ── CHRISTMAS: string lights + Santa who lights them (one per header) ── */
document.querySelectorAll('.header').forEach(h => {
  const cols = ['#ff4b55', '#ffd75e', '#3fae76', '#7cc4ff', '#fff3b0'];
  const L = document.createElement('div');
  L.className = 'lights';
  for (let i = 0; i < 16; i++) {
    const b = document.createElement('span');
    b.className = 'bulb';
    b.style.cssText = '--c:' + cols[i % 5] + ';--d:' + (0.5 + 2.8 * i / 15).toFixed(2) + 's;--g:' + ((i * 0.23) % 1.4).toFixed(2) + 's';
    L.appendChild(b);
  }
  const s = document.createElement('div');
  s.className = 'santa';
  s.innerHTML = '<i>✨🎅</i>';
  h.appendChild(L);
  h.appendChild(s);
});

/* wheel bulbs keep twinkling while the wheel is idle */
(function idleWheel() {
  if (!spinning && document.getElementById('s-spin').classList.contains('active')) drawWheel(currentAngle);
  setTimeout(() => requestAnimationFrame(idleWheel), 120);
})();

/* ── START ── */
applyLang();
</script>
